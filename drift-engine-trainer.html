<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift Engine — Training Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">

<style>
  /* ── Theme ── */
  :root {
    --bg:          hsl(230, 35%, 8%);
    --bg-2:        hsl(230, 30%, 11%);
    --fg:          hsl(40, 28%, 88%);
    --fg-muted:    hsl(40, 18%, 65%);
    --gold:        hsl(44, 72%, 55%);
    --gold-dim:    hsl(44, 45%, 38%);
    --card-bg:     hsl(38, 30%, 87%);
    --card-fg:     hsl(230, 40%, 13%);
    --card-border: hsl(38, 28%, 74%);
    --card-muted:  hsl(230, 20%, 32%);
    --border:      hsl(230, 22%, 20%);

    /* Per-bank accent colors (subtle) */
    --b1: hsl(44,  70%, 55%);   /* Conjunctions   — gold */
    --b2: hsl(190, 55%, 52%);   /* Soft Qualifiers — teal */
    --b3: hsl(280, 45%, 62%);   /* Nominalizations — violet */
    --b4: hsl(160, 50%, 50%);   /* Unspecified Verbs — green */
    --b5s: hsl(30, 65%, 55%);   /* Sensory — amber */
    --b5a: hsl(210, 50%, 55%);  /* Atmospheric — steel blue */
    --b5e: hsl(340, 45%, 58%);  /* Emotional — rose */
    --b5f: hsl(170, 50%, 48%);  /* Flow — seafoam */
    --b5t: hsl(22,  55%, 52%);  /* Texture — terracotta */
    --b5l: hsl(55,  55%, 52%);  /* Light/Shadow — straw */
    --b5adv: hsl(240, 40%, 60%);/* Adverbs — indigo */
    --b6: hsl(200, 55%, 52%);   /* Temporal — cerulean */
    --b7: hsl(10,  60%, 55%);   /* -ing Engine — coral */
    --b8: hsl(270, 45%, 58%);   /* Syntax — lavender */
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Crimson Pro', 'Georgia', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.028;
    pointer-events: none;
    z-index: 999;
  }

  /* ── Layout ── */
  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  /* ── Header ── */
  header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .header-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.75rem;
    opacity: 0.9;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--fg);
    margin-bottom: 0.5rem;
  }

  header p {
    font-family: 'Crimson Pro', serif;
    font-weight: 300;
    font-style: italic;
    color: var(--fg-muted);
    font-size: 1rem;
  }

  /* ── Controls bar ── */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--border);
  }

  .btn-deal {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    letter-spacing: 0.05em;
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    padding: 0.6rem 1.6rem;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .btn-deal:hover {
    background: hsla(44, 60%, 50%, 0.1);
    border-color: var(--gold);
    box-shadow: 0 0 18px hsla(44, 70%, 55%, 0.15);
  }

  .hand-info {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-left: auto;
  }

  /* ── Bank filter pills ── */
  .filter-section {
    margin-bottom: 2.5rem;
  }
  .filter-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 0.75rem;
    display: block;
  }
  .filter-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .pill {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg-muted);
    padding: 0.3rem 0.75rem;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .pill.active {
    color: var(--card-bg);
    border-color: transparent;
  }
  .pill[data-bank="b1"].active  { background: var(--b1);   }
  .pill[data-bank="b2"].active  { background: var(--b2);   }
  .pill[data-bank="b3"].active  { background: var(--b3);   }
  .pill[data-bank="b4"].active  { background: var(--b4);   }
  .pill[data-bank="b5s"].active { background: var(--b5s);  }
  .pill[data-bank="b5a"].active { background: var(--b5a);  }
  .pill[data-bank="b5e"].active { background: var(--b5e);  }
  .pill[data-bank="b5f"].active { background: var(--b5f);  }
  .pill[data-bank="b5t"].active { background: var(--b5t);  }
  .pill[data-bank="b5l"].active { background: var(--b5l);  }
  .pill[data-bank="b5adv"].active { background: var(--b5adv); }
  .pill[data-bank="b6"].active  { background: var(--b6);   }
  .pill[data-bank="b7"].active  { background: var(--b7);   }
  .pill[data-bank="b8"].active  { background: var(--b8);   }

  /* ── Hand size control ── */
  .size-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-left: auto;
  }
  .size-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .size-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-muted);
    width: 1.8rem; height: 1.8rem;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .size-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .size-val {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--fg);
    min-width: 1.5rem;
    text-align: center;
  }

  /* ── Card Grid ── */
  .hand {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.25rem;
  }

  /* ── Card ── */
  .card {
    background: var(--card-bg);
    color: var(--card-fg);
    border: 1px solid var(--card-border);
    border-radius: 3px;
    padding: 1.4rem 1.5rem 1.4rem;
    min-height: 15rem;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35), 0 1px 4px rgba(0,0,0,0.2);
    cursor: default;
    transition: transform 0.18s, box-shadow 0.18s;
    animation: cardIn 0.3s ease both;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.25);
  }

  /* Noise texture on card */
  .card::before {
    content: '';
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
  }

  /* Color accent bar at top */
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    opacity: 0.7;
  }
  .card[data-bank="b1"]::after   { background: var(--b1);    }
  .card[data-bank="b2"]::after   { background: var(--b2);    }
  .card[data-bank="b3"]::after   { background: var(--b3);    }
  .card[data-bank="b4"]::after   { background: var(--b4);    }
  .card[data-bank="b5s"]::after  { background: var(--b5s);   }
  .card[data-bank="b5a"]::after  { background: var(--b5a);   }
  .card[data-bank="b5e"]::after  { background: var(--b5e);   }
  .card[data-bank="b5f"]::after  { background: var(--b5f);   }
  .card[data-bank="b5t"]::after  { background: var(--b5t);   }
  .card[data-bank="b5l"]::after  { background: var(--b5l);   }
  .card[data-bank="b5adv"]::after{ background: var(--b5adv); }
  .card[data-bank="b6"]::after   { background: var(--b6);    }
  .card[data-bank="b7"]::after   { background: var(--b7);    }
  .card[data-bank="b8"]::after   { background: var(--b8);    }

  /* Card header row */
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.2rem;
    opacity: 0.55;
    transition: opacity 0.15s;
  }
  .card:hover .card-header { opacity: 1; }

  .card-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    color: var(--card-muted);
  }
  .card-cat {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--card-muted);
  }

  /* Card center word */
  .card-word {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0;
  }
  .card-word h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    font-weight: 400;
    text-align: center;
    line-height: 1.2;
    color: var(--card-fg);
    letter-spacing: 0.01em;
  }
  /* Italic style for soft qualifiers and longer phrases */
  .card-word h2.phrase {
    font-size: clamp(1.1rem, 3vw, 1.45rem);
    font-style: italic;
  }

  /* Card footer */
  .card-footer {
    margin-top: 1rem;
    padding-top: 0.9rem;
    border-top: 1px solid hsla(230, 30%, 20%, 0.18);
    font-family: 'Crimson Pro', serif;
    font-size: 0.88rem;
    font-weight: 300;
    line-height: 1.55;
    color: var(--card-muted);
  }
  .card-desc {
    margin-bottom: 0.6rem;
  }
  .card-example {
    font-style: italic;
    font-size: 0.82rem;
    opacity: 0.75;
    line-height: 1.5;
  }

  /* ── Empty state ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 1rem;
    color: var(--fg-muted);
    font-style: italic;
    font-size: 1rem;
  }

  /* ── Focus mode overlay ── */
  .focus-overlay {
    display: none;
    position: fixed; inset: 0;
    background: hsla(230, 35%, 5%, 0.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    padding: 2rem;
  }
  .focus-overlay.visible { display: flex; }

  .focus-inner {
    position: relative;
    width: 100%;
    max-width: 480px;
  }

  .focus-card {
    background: var(--card-bg);
    color: var(--card-fg);
    border: 1px solid var(--card-border);
    border-radius: 3px;
    padding: 2.5rem 2.5rem 2rem;
    min-height: 22rem;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .focus-card::before {
    content: '';
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.035;
    pointer-events: none;
  }

  .focus-card .card-header { margin-bottom: 1.8rem; }
  .focus-card .card-word h2 { font-size: clamp(2rem, 6vw, 3rem); }
  .focus-card .card-word h2.phrase { font-size: clamp(1.4rem, 4vw, 1.9rem); }
  .focus-card .card-footer { font-size: 0.94rem; }
  .focus-card .card-example { font-size: 0.88rem; }

  .focus-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.5rem;
  }

  .focus-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-muted);
    padding: 0.45rem 1rem;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .focus-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .focus-btn:disabled { opacity: 0.25; cursor: default; }
  .focus-btn:disabled:hover { border-color: var(--border); color: var(--fg-muted); }

  .focus-close {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    background: transparent;
    border: none;
    color: var(--fg-muted);
    cursor: pointer;
    padding: 0.5rem;
    position: absolute;
    top: -2.2rem;
    right: 0;
    transition: color 0.15s;
  }
  .focus-close:hover { color: var(--fg); }

  .focus-counter {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    color: var(--fg-muted);
  }

  /* ── Mode toggle ── */
  .mode-toggle {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-muted);
    padding: 0.4rem 0.9rem;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mode-toggle:hover { border-color: var(--gold-dim); color: var(--gold); }

  /* ── Animations ── */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Footer ── */
  .deck-footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .deck-footer span {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--fg-muted);
    opacity: 0.5;
  }

  /* Responsive */
  @media (max-width: 500px) {
    .controls { flex-direction: column; align-items: flex-start; }
    .hand-info, .size-controls { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="header-eyebrow">The Bandler Drift Engine</div>
    <h1>Training Deck</h1>
    <p>Shuffle the banks. Build the sentences. Carry it in your head.</p>
  </header>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-deal" id="dealBtn">Deal a new hand</button>
    <button class="mode-toggle" id="modeBtn">⊞ Focus mode</button>
    <div class="size-controls">
      <span class="size-label">Hand</span>
      <button class="size-btn" id="sizeDown">−</button>
      <span class="size-val" id="sizeVal">6</span>
      <button class="size-btn" id="sizeUp">+</button>
    </div>
    <span class="hand-info" id="handInfo">HAND 001</span>
  </div>

  <!-- Bank Filters -->
  <div class="filter-section">
    <span class="filter-label">Draw from banks</span>
    <div class="filter-pills" id="filterPills"></div>
  </div>

  <!-- Card Hand -->
  <div class="hand" id="hand"></div>

  <!-- Footer -->
  <div class="deck-footer">
    <span>Drift Engine — NLP Training Tool</span>
    <span id="deckCount">— cards in deck</span>
  </div>

</div><!-- .app -->

<!-- Focus Mode Overlay -->
<div class="focus-overlay" id="focusOverlay">
  <div class="focus-inner">
    <button class="focus-close" id="focusClose">✕ close</button>
    <div class="focus-card" id="focusCard">
      <!-- populated by JS -->
    </div>
    <div class="focus-nav">
      <button class="focus-btn" id="focusPrev">← prev</button>
      <span class="focus-counter" id="focusCounter">1 / 6</span>
      <button class="focus-btn" id="focusNext">next →</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  CARD DATA
// ─────────────────────────────────────────────

const BANKS = {
  b1: {
    label: 'Bank 1',
    cat: 'Conjunction',
    color: 'b1',
    cards: [
      { word: 'while', desc: 'Hinge two clauses together — the listener follows the first straight into the second with no room to resist.', ex: '"...the plate kept turning quietly, while the lightbulb steadily flickered inside the dim microwave."' },
      { word: 'as', desc: 'Tie two simultaneous events together so tightly the mind merges them into a single experience.', ex: '"...as the dust settled slowly on the windowsill, something in the room began to ease."' },
      { word: 'because', desc: 'Offer causality and the critical mind accepts the chain without checking whether it holds.', ex: '"...and you began to relax, because the light through the curtains was warm and still."' },
      { word: 'since', desc: 'A softer causality — offers a reason without insisting on it, letting the listener supply the logic themselves.', ex: '"...since the room had grown quieter, it was easier to let everything settle."' },
      { word: 'although', desc: 'Acknowledge a contrary thought and dissolve it in the same breath — the resistance has nowhere to stand.', ex: '"...although you hadn\'t expected it, the afternoon had stretched out longer than anyone planned."' },
      { word: 'even though', desc: 'Stronger than although — explicitly validates the counter-thought before letting it dissolve.', ex: '"...even though the wheel kept turning on its own, it didn\'t feel strange, just continuous."' },
      { word: 'until', desc: 'Stretches the present moment toward a resolution that never quite arrives — suspending the listener in between.', ex: '"...and the coin kept spinning on the counter until the light from the window caught it."' },
      { word: 'before', desc: 'Pulls the mind slightly ahead of the present moment, creating gentle forward motion.', ex: '"...before I quite knew it, the afternoon had already begun to shift."' },
      { word: 'after', desc: 'Anchors a state by placing it inside a sequence — it already happened, the mind stops resisting it.', ex: '"...after the sound faded from the room, there was this quiet that seemed to hold everything."' },
      { word: 'once', desc: 'Conditions a state on a threshold that implies it will cross — the mind leans into the crossing.', ex: '"...once the pendulum found its rhythm, the room felt different than before."' },
      { word: 'whenever', desc: 'Makes a state habitual and inevitable — not one event but a pattern the mind now expects.', ex: '"...whenever the breeze came through the window, the curtain moved in the same slow way."' },
      { word: 'just as', desc: 'Creates perfect simultaneity — two things happening at exactly the same moment, fusing their meanings.', ex: '"...just as the flame straightened itself, something in the air of the room changed."' },
      { word: 'the moment', desc: 'Collapses time to a single edge — everything pivots exactly there, and the listener is inside the pivot.', ex: '"...the moment the hinge gave, the door drifted open on its own."' },
      { word: 'every time', desc: 'Transforms a single event into a law — the pattern is now built into the world.', ex: '"...every time the needle moved, it pulled the thread a little further through."' },
      { word: 'as long as', desc: 'Conditions a state on a background that\'s already true — the state is therefore already in effect.', ex: '"...as long as the water kept pouring, the sound made everything else easy to ignore."' },
      { word: 'as soon as', desc: 'Creates an immediate trigger-response link — action A causes state B without any gap.', ex: '"...as soon as the candle was lit, the shadows in the corners began to soften."' },
      { word: 'by the time', desc: 'Presupposes the state will arrive — only the timing is open, not whether it happens.', ex: '"...by the time I looked up again, the room had changed in some way I couldn\'t quite name."' },
      { word: 'now that', desc: 'Presents a new fact as already established — the state it describes is treated as given.', ex: '"...now that the window was open, the air had a different quality to it."' },
      { word: 'unless', desc: 'Implies that the default case is already happening — only the exception could disrupt it.', ex: '"...unless the coin stopped spinning entirely, there was no reason to look away."' },
      { word: 'even if', desc: 'Removes every condition that might prevent the state — what remains is the state, inevitable.', ex: '"...even if you weren\'t sure why, the weight of the afternoon kept settling."' },
      { word: 'whereas', desc: 'Draws a quiet contrast that reframes — the listener sees the difference without being told what to do with it.', ex: '"...whereas the first room had been still, this one held a low, continuous hum."' },
      { word: 'as if', desc: 'Invites the mind to simulate a state through hypothetical reality — more vivid than description, more flexible than assertion.', ex: '"...and the floor seemed to give just slightly, as if the whole building had exhaled."' },
      { word: 'as though', desc: 'Slightly more formal than as if — offers a simile at the level of felt truth rather than observation.', ex: '"...the silence had a texture to it, as though the room were holding something in reserve."' },

      { word: 'sort of', desc: 'Casual and disarming — the most natural hedge in spoken language, which is exactly why it works.', ex: '"...and the room sort of gathered itself, the way rooms do when everyone stops talking at once."' },

      { word: 'candlelit',     cat: 'Atmospheric',         desc: 'Immediately shifts the quality of attention — the brain enters a different perceptual mode.', ex: '"...the room had a candlelit, amber, close quality, as if the walls had moved in slightly."' },
      { word: 'overcast',      cat: 'Atmospheric',         desc: 'Removes shadows entirely — the light comes from everywhere and nowhere, which is disorienting in the gentlest way.', ex: '"...the sky had an overcast, flat, suspended quality that made time harder to track."' },

      { word: 'smoldering',    cat: 'Atmospheric',         desc: 'Heat without flame — implies something ongoing and slow beneath the surface of the visible.', ex: '"...there was a smoldering, deep, amber quality to the coals that hadn\'t needed any tending."' },
      { word: 'ambient',       cat: 'Atmospheric',         desc: 'Sound or light that has no direction — it\'s simply in the room, everywhere and from nowhere.', ex: '"...the hum had an ambient, sourceless, continuous quality that had been there the whole time."' },
      { word: 'echo-filled',   cat: 'Atmospheric',         desc: 'The space responds to itself — sound becomes an object that the room holds and returns.', ex: '"...the stairwell had an echo-filled, hollow, resonant quality that made every step sound careful."' },
      { word: 'tranquil',      cat: 'Emotional-State',     desc: 'Use sparingly and indirectly — let the environment carry the word, not the person. The scene is tranquil; the listener arrives.', ex: '"...and the surface of the water had a tranquil, undisturbed, horizontal quality."' },
      { word: 'wistful',       cat: 'Emotional-State',     desc: 'Gentle nostalgia without a specific object — the listener searches inward to find what it refers to.', ex: '"...there was a wistful, soft, backward-leaning quality to the light at that hour."' },

      { word: 'serene',        cat: 'Emotional-State',     desc: 'A state already achieved — place the word on the environment and the listener walks into it.', ex: '"...the garden had a serene, unmoving, perfectly-balanced quality in the flat midday light."' },

      { word: 'sinking', desc: 'Downward, gradual, gentle — the listener\'s body registers this and follows, which is the mechanism.', ex: '"...and something in the chest kept sinking, slowly, into a place where it could stay."' },

      { word: 'cascading', desc: 'Sequential release — one after another, each thing following the last, with no effort between them.', ex: '"...the water kept cascading down the stepped stones, one level to the next, without stopping."' },
      { word: 'drifting', desc: 'The foundational motion — purposeless, directionless, going where the current takes it, and that\'s exactly right.', ex: '"...and the boat kept drifting, quietly, without anyone at the oars, into the open center."' },
      { word: 'revolving', desc: 'Rotates around a center — the listener\'s attention orbits with it, staying close to the pivot.', ex: '"...the arm of the clock kept revolving, at its own pace, as if the afternoon had decided to cooperate."' },
    ]
  },

  b8: {
    label: 'Bank 8',
    cat: 'Kinetic Syntax',
    color: 'b8',
    cards: [
      { word: 'kept [verb]-ing', desc: 'Slot a continuous verb into the bracket — motion never resolves, and neither does the listener.', ex: '"...and the plate just kept turning inside the dim microwave, never quite coming to rest."' },
      { word: 'was steadily [verb]-ing', desc: 'Adds a temporal depth — the motion was already in progress before the scene began. It has always been true.', ex: '"...the fan was steadily turning, low and continuous, in the corner of the room."' },
      { word: 'just continued [verb]-ing', desc: '"Just" removes emphasis and naturalizes the motion — it didn\'t restart, it simply never stopped.', ex: '"...and the pendulum just continued swinging, as if the whole question of stopping had never come up."' },
      { word: 'found itself [verb]-ing', desc: 'Removes the agent entirely — the object didn\'t do anything; it discovered it was already in motion.', ex: '"...the coin found itself spinning on the granite counter before anyone had quite decided anything."' },
      { word: 'began [verb]-ing and [verb]-ing', desc: 'Chain two -ing verbs to create compounding motion — each one deepens the other without adding complexity.', ex: '"...and the leaf began drifting and rotating on the surface of the slow water."' },
      { word: 'remained [verb]-ing', desc: 'Stasis inside motion — the object doesn\'t change, which makes the motion feel permanent rather than temporary.', ex: '"...the top remained spinning on the table, long past the point where you\'d expected it to fall."' },
      { word: 'never stopped [verb]-ing', desc: 'The most explicit form — removes any possibility of interruption. The motion is simply an ongoing condition of the world.', ex: '"...the wheel had never stopped turning, not once since the afternoon began."' },
    ]
  }
};

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let handCount = 1;
let handSize = 6;
let activeBanks = new Set(Object.keys(BANKS));
let currentHand = [];
let focusIndex = 0;

// ─────────────────────────────────────────────
//  BUILD PILL FILTERS
// ─────────────────────────────────────────────
const pillContainer = document.getElementById('filterPills');
Object.entries(BANKS).forEach(([key, bank]) => {
  const btn = document.createElement('button');
  btn.className = 'pill active';
  btn.dataset.bank = key;
  btn.textContent = `${bank.label} · ${bank.cat}`;
  btn.addEventListener('click', () => {
    if (activeBanks.has(key)) {
      if (activeBanks.size <= 1) return; // always keep at least one
      activeBanks.delete(key);
      btn.classList.remove('active');
    } else {
      activeBanks.add(key);
      btn.classList.add('active');
    }
    updateDeckCount();
  });
  pillContainer.appendChild(btn);
});

// ─────────────────────────────────────────────
//  CARD POOL
// ─────────────────────────────────────────────
function getPool() {
  const pool = [];
  activeBanks.forEach(key => {
    BANKS[key].cards.forEach((card, i) => {
      pool.push({ ...card, bank: key, bankLabel: BANKS[key].label, cat: BANKS[key].cat, color: BANKS[key].color, index: i + 1 });
    });
  });
  return pool;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Stratified deal: pick cards evenly across all active banks.
// Round-robins through banks (each shuffled independently), so a hand
// of 6 with 14 active banks pulls ~1 card per bank rather than
// over-representing the larger banks.
function dealStratified(n) {
  const bankKeys = [...activeBanks];
  if (bankKeys.length === 0) return [];

  // Shuffle each bank's cards independently
  const shuffled = {};
  bankKeys.forEach(key => {
    shuffled[key] = shuffle(
      BANKS[key].cards.map((card, i) => ({
        ...card, bank: key, bankLabel: BANKS[key].label,
        cat: BANKS[key].cat, color: BANKS[key].color, index: i + 1
      }))
    );
  });

  // Pointers per bank
  const ptrs = {};
  bankKeys.forEach(k => ptrs[k] = 0);

  // Shuffle the bank order itself so we don't always start with the same bank
  const bankOrder = shuffle(bankKeys);

  const result = [];
  let round = 0;
  while (result.length < n) {
    const key = bankOrder[round % bankOrder.length];
    const ptr = ptrs[key];
    if (ptr < shuffled[key].length) {
      result.push(shuffled[key][ptr]);
      ptrs[key]++;
    }
    round++;
    // Safety: if we've exhausted everything, break
    if (round > n * bankKeys.length + bankKeys.length) break;
  }

  // Final shuffle so same-bank cards don't always appear adjacent
  return shuffle(result);
}

function updateDeckCount() {
  const n = getPool().length;
  document.getElementById('deckCount').textContent = `${n} cards in deck`;
}

// ─────────────────────────────────────────────
//  RENDER CARD HTML
// ─────────────────────────────────────────────
function cardHTML(card, isFocus = false) {
  const isPhrase = card.word.length > 16;
  const cls = isFocus ? 'focus-card' : 'card';
  const attrs = isFocus ? '' : `data-bank="${card.color}"`;
  return `
    <div class="card-header">
      <span class="card-num">${String(card.index).padStart(2,'0')}</span>
      <span class="card-cat">${card.cat}</span>
    </div>
    <div class="card-word">
      <h2 class="${isPhrase ? 'phrase' : ''}">${card.word}</h2>
    </div>
    <div class="card-footer">
      <div class="card-desc">${card.desc}</div>
      <div class="card-example">${card.example || card.ex}</div>
    </div>
  `;
}

// ─────────────────────────────────────────────
//  DEAL HAND
// ─────────────────────────────────────────────
function deal() {
  currentHand = dealStratified(handSize);
  handCount++;

  const hand = document.getElementById('hand');
  hand.innerHTML = '';

  if (currentHand.length === 0) {
    hand.innerHTML = '<div class="empty-state">No banks selected — enable at least one above.</div>';
    return;
  }

  currentHand.forEach((card, i) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.bank = card.color;
    div.style.animationDelay = `${i * 0.04}s`;
    div.innerHTML = cardHTML(card);
    div.addEventListener('click', () => openFocus(i));
    hand.appendChild(div);
  });

  document.getElementById('handInfo').textContent = `HAND ${String(handCount - 1).padStart(3, '0')}`;
}

// ─────────────────────────────────────────────
//  FOCUS MODE
// ─────────────────────────────────────────────
function openFocus(index) {
  focusIndex = index;
  renderFocusCard();
  document.getElementById('focusOverlay').classList.add('visible');
}

function renderFocusCard() {
  const card = currentHand[focusIndex];
  const fc = document.getElementById('focusCard');
  // Remove old bank color class
  fc.removeAttribute('data-bank');
  fc.setAttribute('data-bank', card.color);
  fc.style.borderTopColor = '';
  fc.innerHTML = `
    <div class="card-header">
      <span class="card-num">${String(card.index).padStart(2,'0')}</span>
      <span class="card-cat">${card.cat}</span>
    </div>
    <div class="card-word">
      <h2 class="${card.word.length > 16 ? 'phrase' : ''}">${card.word}</h2>
    </div>
    <div class="card-footer">
      <div class="card-desc">${card.desc}</div>
      <div class="card-example">${card.ex}</div>
    </div>
  `;

  document.getElementById('focusCounter').textContent = `${focusIndex + 1} / ${currentHand.length}`;
  document.getElementById('focusPrev').disabled = focusIndex === 0;
  document.getElementById('focusNext').disabled = focusIndex === currentHand.length - 1;
}

document.getElementById('focusClose').addEventListener('click', () => {
  document.getElementById('focusOverlay').classList.remove('visible');
});

document.getElementById('focusOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('focusOverlay')) {
    document.getElementById('focusOverlay').classList.remove('visible');
  }
});

document.getElementById('focusPrev').addEventListener('click', () => {
  if (focusIndex > 0) { focusIndex--; renderFocusCard(); }
});

document.getElementById('focusNext').addEventListener('click', () => {
  if (focusIndex < currentHand.length - 1) { focusIndex++; renderFocusCard(); }
});

// Keyboard nav in focus mode
document.addEventListener('keydown', (e) => {
  const overlay = document.getElementById('focusOverlay');
  if (!overlay.classList.contains('visible')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (focusIndex < currentHand.length - 1) { focusIndex++; renderFocusCard(); }
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    if (focusIndex > 0) { focusIndex--; renderFocusCard(); }
  }
  if (e.key === 'Escape') overlay.classList.remove('visible');
});

// ─────────────────────────────────────────────
//  HAND SIZE CONTROLS
// ─────────────────────────────────────────────
document.getElementById('sizeDown').addEventListener('click', () => {
  if (handSize > 1) { handSize--; document.getElementById('sizeVal').textContent = handSize; }
});
document.getElementById('sizeUp').addEventListener('click', () => {
  if (handSize < 12) { handSize++; document.getElementById('sizeVal').textContent = handSize; }
});

// ─────────────────────────────────────────────
//  DEAL BUTTON + MODE
// ─────────────────────────────────────────────
document.getElementById('dealBtn').addEventListener('click', deal);
document.getElementById('modeBtn').addEventListener('click', () => {
  if (currentHand.length === 0) return;
  openFocus(0);
});

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
updateDeckCount();
deal();
</script>

</html>
